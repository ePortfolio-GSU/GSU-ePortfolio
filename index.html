<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        GSU Embakasi Academy | E-Portfolio Portal
    </title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="login-card">

            <!-- School Branding -->
           <div class="header">

    <img 
    src="logo.png" 
    alt="GSU Embakasi Academy Logo"
    class="logo">

    <h2>
        E-PORTFOLIO PORTAL
    </h2>

</div>


            <!-- Login Form -->
            <form id="loginForm">

                <label for="username">
                    Username
                </label>

                <input 
                type="text"
                id="username"
                placeholder="Assessment No / National ID"
                autocomplete="username"
                required>


                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required>


                    <span id="togglePassword">
                        👁
                    </span>

                </div>


                <label class="show-password">

                    <input 
                    type="checkbox"
                    id="showPassword">

                    Show Password

                </label>


                <a href="#" class="forgot">
                    Forgot Password?
                </a>


                <button type="submit">
                    LOGIN
                </button>


                <p id="message"></p>


            </form>


        </section>
<div class="signup-container">
    <p>New to GSU Embakasi Academy?</p>
    <button type="button" class="signup-btn">
        + Sign Up
    </button>
</div>
       <footer>
    © 2026 GSU Embakasi Academy.
    <br>
    Dev. Eng. Kima
    <br>
    All Rights Reserved.
    <br>
    Version 1.0
</footer>


    </main>


<script src="script.js"></script>

</body>
</html>
