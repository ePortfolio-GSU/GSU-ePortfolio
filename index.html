<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GSU Embakasi Academy ePortfolio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f7fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:420px;
background:#fff;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
overflow:hidden;
}

.header{
background:#003366;
color:white;
text-align:center;
padding:25px;
}

.logo{
width:90px;
height:90px;
margin:auto;
margin-bottom:15px;
border-radius:50%;
background:white;
display:flex;
align-items:center;
justify-content:center;
color:#003366;
font-weight:bold;
}

.header h1{
font-size:24px;
margin-bottom:8px;
}

.header p{
font-size:14px;
}

.form{
padding:25px;
}

.form label{
display:block;
margin-bottom:6px;
font-weight:bold;
color:#333;
}

.form input{
width:100%;
padding:14px;
margin-bottom:18px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

.password-box{
position:relative;
}

.toggle{
position:absolute;
right:15px;
top:15px;
font-size:14px;
cursor:pointer;
color:#003366;
}

.options{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
font-size:14px;
}

button{
width:100%;
padding:15px;
background:#0056b3;
color:white;
border:none;
border-radius:8px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#003f88;
}

.forgot{
text-align:center;
margin-top:20px;
}

.forgot a{
text-decoration:none;
color:#0056b3;
font-weight:bold;
}

.footer{
text-align:center;
padding:20px;
font-size:13px;
background:#f5f5f5;
color:#555;
}

.floating{
position:fixed;
right:18px;
bottom:18px;
display:flex;
flex-direction:column;
gap:12px;
}

.float-btn{
width:55px;
height:55px;
border-radius:50%;
background:#003366;
color:white;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
box-shadow:0 4px 12px rgba(0,0,0,.3);
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="logo">
LOGO
</div>

<h1>GSU EMBAKASI ACADEMY</h1>

<p>ePortfolio Management System</p>

</div>

<div class="form">

<label>Username</label>

<input type="text" placeholder="Assessment Number / National ID">

<label>Password</label>

<div class="password-box">

<input type="password" id="password" placeholder="Password">

<span class="toggle" onclick="togglePassword()">👁</span>

</div>

<div class="options">

<label>
<input type="checkbox">
 Remember Me
</label>

</div>

<button>LOGIN</button>

<div class="forgot">

<a href="#">Forgot Password?</a>

</div>

</div>

<div class="footer">

© 2026 GSU Embakasi Academy

<br>

Version 1.0

</div>

</div>

<div class="floating">

<div class="float-btn">🔔</div>

<div class="float-btn">💬</div>

</div>

<script>

function togglePassword(){

const p=document.getElementById("password");

if(p.type==="password"){
p.type="text";
}else{
p.type="password";
}

}

</script>

</body>
</html>
