<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GSU Embakasi Academy ePortfolio Portal</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard-wrapper">

    <!-- Header -->

    <header class="dashboard-header">

    <div class="dashboard-logo">

        <img src="GSU Logo.png" alt="GSU Logo">

        <div class="dashboard-title">

            <h2 id="schoolName">GSU Embakasi Academy</h2>

            <p id="dashboardTitle">ePortfolio Management System</p>

        </div>

    </div>

    <div class="dashboard-user-area">

        <span id="currentUser">
            Welcome
        </span>

        <button id="notificationBtn" title="Notifications">
            🔔
        </button>

        <button id="profileBtn" title="Profile">
            👤
        </button>

        <button id="logoutBtn" title="Logout" onclick="logoutUser()">
    Logout
</button>

    </div>

</header>


    <!-- Sidebar -->

    <aside class="dashboard-sidebar">

    <ul id="sidebarMenu">

    </ul>

</aside>


    <!-- Main Content -->

    <main class="dashboard-main">

       <div class="dashboard-content">

    <div class="dashboard-breadcrumb">
        Home / Dashboard Overview
    </div>

    <h1 class="dashboard-section-title"
    id="dashboardHeading">

    Dashboard

</h1>

    <div id="dashboardCards">

    </div>
<div id="dashboardWorkspace">

</div>
    <div id="dashboardActivity">

    </div>

</div>

    </main>

</div>


<footer class="dashboard-footer">

</footer>

<script>

document.addEventListener("DOMContentLoaded", function(){

    const user = sessionStorage.getItem("loggedUser");
    const role = sessionStorage.getItem("userRole");

    if(!user || !role){

        alert("Your session has expired. Please login again.");

        window.location.href = "index.html";

        return;

    }

    initializeDashboard();

});

</script>

<script src="script.js"></script>

</body>

</html>
