<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B57D0">
    <title>GSU Embakasi Academy | ePortfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">

<div class="dashboard-wrapper">

    <header class="dashboard-header">
        <div class="dashboard-logo">
    <img src="logo.png" alt="GSU Embakasi Academy logo">

    <div class="dashboard-title">
        <h2>GSU EMBAKASI ACADEMY</h2>
        <p>Discipline breeds excellence</p>
    </div>
</div>

        <div class="dashboard-user-area">
            <span id="currentUser">Welcome</span>

            <button id="notificationBtn" class="header-icon"
                    type="button" aria-label="Notifications"
                    title="Notifications">🔔</button>

            <div class="profile-dropdown">
                <button id="profileBtn" class="header-icon"
                        type="button" aria-label="Profile menu"
                        aria-expanded="false" aria-controls="profileMenu">
                    👤
                </button>

                <div id="profileMenu" class="profile-menu" hidden>
                    <button id="myProfileBtn" type="button">My Profile</button>
                    <button id="logoutBtn" type="button">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <div class="mobile-menu-strip">
        <button id="menuToggle" type="button"
                aria-label="Open navigation menu"
                aria-controls="sidebarMenu"
                aria-expanded="false">☰ Menu</button>

        <div id="sidebarQuickIcons"
             class="sidebar-quick-icons"
             aria-label="Dashboard navigation icons"></div>

        <aside class="dashboard-sidebar" id="dashboardSidebar"
               aria-label="Dashboard navigation">
            <ul id="sidebarMenu"></ul>
        </aside>
    </div>

    <main class="dashboard-main">
        <div class="dashboard-content">

            <div class="dashboard-breadcrumb" id="dashboardBreadcrumb">
                Home
            </div>

            <h1 class="dashboard-section-title"
                id="dashboardHeading" hidden>Dashboard</h1>

          <section class="dashboard-welcome" aria-live="polite">

    <div class="welcome-top">
        <div class="welcome-cap-icon" aria-hidden="true">
            <svg viewBox="0 0 100 100">
                <path d="M10 36 L50 14 L90 36 L50 58 Z"
                      fill="none" stroke="currentColor"
                      stroke-width="5" stroke-linejoin="round"/>
                <path d="M25 47 V66 Q50 86 75 66 V47"
                      fill="none" stroke="currentColor"
                      stroke-width="5"/>
                <path d="M90 36 V65"
                      stroke="currentColor" stroke-width="5"/>
                <circle cx="90" cy="70" r="5"
                        fill="currentColor"/>
                <path d="M35 77 Q50 69 65 77"
                      fill="none" stroke="currentColor"
                      stroke-width="4"/>
            </svg>
        </div>

        <div class="welcome-heading-divider"></div>

        <h2 id="welcomeHeading">Welcome</h2>

        <div class="welcome-maroon-tab"></div>
    </div>

    <div class="welcome-energy-line">
        <span></span>
    </div>

    <div class="welcome-message-row">

        <div class="welcome-rocket-icon" aria-hidden="true">
            <svg viewBox="0 0 100 100">
                <path d="M25 72 Q18 45 49 18 Q68 2 87 8
                         Q92 27 75 49 Q49 80 25 72 Z"
                      fill="none" stroke="currentColor"
                      stroke-width="5" stroke-linejoin="round"/>
                <circle cx="63" cy="31" r="9"
                        fill="none" stroke="currentColor"
                        stroke-width="5"/>
                <path d="M25 53 L10 57 L7 78 L30 68
                         M48 75 L43 91 L23 94 L29 72"
                      fill="none" stroke="currentColor"
                      stroke-width="5" stroke-linejoin="round"/>
                <path d="M17 82 L7 94 M33 87 L25 97"
                      stroke="currentColor" stroke-width="4"/>
            </svg>
        </div>

        <div class="welcome-message-divider"></div>

        <p id="welcomeMessage">
            Welcome to the GSU Embakasi Academy ePortfolio System.
        </p>

    </div>

    <div class="welcome-bottom">
        <div class="welcome-trophy-icon" aria-hidden="true">
            <svg viewBox="0 0 100 100">
                <path d="M28 15 H72 V43 Q72 68 50 72
                         Q28 68 28 43 Z"
                      fill="none" stroke="currentColor"
                      stroke-width="5"/>
                <path d="M28 25 H12 V38 Q12 57 34 59
                         M72 25 H88 V38 Q88 57 66 59
                         M50 72 V86 M34 88 H66"
                      fill="none" stroke="currentColor"
                      stroke-width="5" stroke-linecap="round"/>
                <path d="M50 27 L54 36 L64 37 L57 44
                         L59 54 L50 49 L41 54 L43 44
                         L36 37 L46 36 Z"
                      fill="currentColor"/>
            </svg>
        </div>

        <div class="welcome-bottom-line"></div>

        <div class="welcome-status-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

</section>
            <div id="dashboardCards"></div>
            <div id="dashboardWorkspace"></div>
            <div id="dashboardActivity"></div>

        </div>
    </main>

    <footer class="dashboard-footer">
        <div>©2026 GSU Embakasi Academy. All Rights Reserved.</div>
    </footer>

</div>

<script src="refresh.js"></script>
    <script src="notifications.js"></script>
<script src="script.js"></script>

</body>
</html>
